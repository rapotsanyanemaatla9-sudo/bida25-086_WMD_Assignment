<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="styles.css">
     <style>
        body {
            background-image: url('🚀 Grow Your Brand Online _ 📈 SEO, Ads, Social Media & More _ 🎯 Digital Marketing Tips & Tricks _.jpg');
            background-repeat: no-repeat;
            background-size: cover;
        }
    </style>
     <style>
        body {
            display: flex;
            justify-content: left;
            align-items: left;
            height: auto;
            background-color: #d4d2d2;
        }
        form {
            width: 100%;
            max-width: 600px;
            background-color: #656978;
            border: 10px;
            padding: 10px;
            height: 50%;
        }
        fieldset {
            border-radius: 3 px;
            border-color: #1d2d43;
            padding: 10px
        }
        legend {
            font-weight: bold;
            font-style: italic;
            margin-bottom: 10px ;
        }
        label {
            font-weight: bold;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #d4d2d2;
            border-radius: border-box;
        }
            .region-division {
                margin-bottom: 10px;
            }
            .region-division label {
                margin-left: 5px;
                display: block;
            }
            .region-division input[type="checkbox"] {
                margin-left: 8px;
                vertical-align: middle;
            }
            input[type="submit"] {
                background-color: #1d2d43;
                color: white;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #3a4a63;
            }   
    </style>
     <style>
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #656978;
            padding: 20px;
            border: 1px solid #1d2d43;
            border-radius: 5px;
            text-align: center;
        }
    </style>
    <link rel="icon" href="RYDER DIGITALS LOGOS.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <button type="Reset Password" class="btn" onclick="openPopup()"></button>
        <div class="popup" id="popup">
        <h2>New password set!</h2>
        <p>You have successfully changed your password. Welcome to Ryder Digitals!</p>
        <button type="button" onclick="closePopup()">Reset Password</button>
        </div>
    </div>
</html>
